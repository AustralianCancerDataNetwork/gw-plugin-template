[project]
name = "gw-plugin-template"
dynamic = ["version"]
description = "Template for a Groundworkers plugin."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "groundworkers>=0.4,<1",
  "oa-configurator>=1.2.1,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
# Groundskeeping is only needed by a plugin that implements a custom
# `tui_workflow`. Keeping it optional means a headless import stays light.
tui = [
  "groundskeeping>=0.6.1,<1",
]
dev = [
  "pytest>=9,<10",
  "ruff>=0.4",
  "ty>=0.0.59",
]

# Groundworkers discovers the plugin object through this group. The left-hand
# name is cosmetic; the object it points at must already be constructed.
[project.entry-points."groundworkers.plugins"]
gw_plugin_template = "gw_plugin_template.plugin:plugin"

# oa-configurator discovers the config class through its own group, so
# `omop-config` can render and validate this plugin's settings.
[project.entry-points."omop.config"]
gw_plugin_template = "gw_plugin_template.config:GwPluginTemplateConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/gw_plugin_template"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
constraint-dependencies = ["setuptools>=83.0.0"]

[tool.uv.sources]
# The `groundworkers.plugins` entry-point group exists only on the groundworkers
# `plugins` branch. Published 0.4.0 installs a plugin and silently never loads
# it. Drop this pin and raise the dependency to `groundworkers>=0.5,<1` once
# that release ships -- uv sources are not recorded in wheel metadata, so a
# release made while this pin is here would resolve to a broken 0.4.0.
groundworkers = { git = "https://github.com/AustralianCancerDataNetwork/groundworkers.git", branch = "plugins" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned explicitly: ruff's implicit default rule set widens between releases,
# which would otherwise break CI on a ruff upgrade rather than on a code change.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.ty.src]
include = ["src"]
